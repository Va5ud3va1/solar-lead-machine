services:
  - type: web
    name: solar-lead-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solar-leads-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
databases:
  - name: solar-leads-db
    databaseName: solar_leads
    user: solar_user
