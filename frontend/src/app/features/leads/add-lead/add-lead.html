<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ modalTitle }}</h2>
      <button class="close-btn" (click)="close()">×</button>
    </div>
    <div *ngIf="error" class="error-message">{{ error }}</div>
    <form (ngSubmit)="saveLead()">
      <div class="form-group">
        <label for="customer">Customer Name *</label>
        <input type="text" id="customer" [(ngModel)]="customer" name="customer" required placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="phone">Phone *</label>
        <input type="text" id="phone" [(ngModel)]="phone" name="phone" required placeholder="9876543210" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" [(ngModel)]="city" name="city" placeholder="Hyderabad" />
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" [(ngModel)]="status" name="status">
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" (click)="close()" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading">{{ submitLabel }}</button>
      </div>
    </form>
  </div>
</div>
