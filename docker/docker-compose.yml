services:

  postgres:
    image: postgres:16
    container_name: solar-postgres
    restart: always
    environment:
      POSTGRES_USER: solar_user
      POSTGRES_PASSWORD: solar_password
      POSTGRES_DB: solar_leads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: solar-redis
    restart: always
    ports:
      - "6379:6379"


volumes:
  postgres_data:
